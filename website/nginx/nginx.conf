worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The stock mime.types file has no Markdown mapping. Register it globally
    # so negotiated .md sidecars served from the page locations get
    # text/markdown without replacing the inherited types table per location.
    types {
        text/markdown md;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    types_hash_max_size 2048;
    server_tokens off;

    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/wasm
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml;

    # Markdown content negotiation for agents: a request whose Accept header
    # contains "text/markdown" (substring match, mirroring Cloudflare's
    # markdown-for-agents behavior, no q-value parsing) probes the ".md"
    # sidecar first in the page-serving try_files chains.
    map $http_accept $md_suffix {
        default "";
        "~*text/markdown" ".md";
    }

    # Canonical Link header for negotiated Markdown responses, derived from
    # the file try_files settled on. Empty for HTML outcomes, which makes
    # add_header omit the header entirely.
    map $uri $md_canonical_link {
        default "";
        "~^/index\.md$" "<https://chillicream.com/>; rel=\"canonical\"";
        "~^(?<md_canonical_path>.+)\.md$" "<https://chillicream.com$md_canonical_path>; rel=\"canonical\"";
    }

    include /etc/nginx/conf.d/default.conf;
}
