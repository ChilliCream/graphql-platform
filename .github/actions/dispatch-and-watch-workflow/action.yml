name: Dispatch and watch workflow
description: Dispatches a workflow_dispatch in another repository and waits for it to complete.

inputs:
  repo:
    description: Target repository in `owner/name` form.
    required: true
  workflow:
    description: Workflow filename (e.g. `release.yaml`) or ID.
    required: true
  ref:
    description: Git ref to dispatch the workflow against. Empty dispatches against the repository's default branch.
    required: false
    default: ""
  inputs-json:
    description: Inputs for the dispatched workflow, as a JSON object.
    required: false
    default: "{}"
  token:
    description: "Token with `actions: write` on the target repository."
    required: true

outputs:
  run-id:
    description: Numeric ID of the dispatched run.
    value: ${{ steps.dispatch.outputs.run-id }}
  run-url:
    description: HTML URL of the dispatched run.
    value: ${{ steps.dispatch.outputs.run-url }}

runs:
  using: composite
  steps:
    - name: 🚀 Dispatch workflow
      id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        WORKFLOW: ${{ inputs.workflow }}
        REF: ${{ inputs.ref }}
        INPUTS_JSON: ${{ inputs.inputs-json }}
      run: |
        set -euo pipefail

        ARGS=()
        while IFS= read -r input; do
          ARGS+=(-f "$input")
        done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$INPUTS_JSON")
        if [ -n "$REF" ]; then
          ARGS+=(--ref "$REF")
        fi

        RUN_URL=$(gh workflow run "$WORKFLOW" --repo "$REPO" "${ARGS[@]}")

        if [ -z "$RUN_URL" ]; then
          echo "::error::Dispatch did not return a run URL. Requires gh >= 2.87.0 against github.com."
          exit 1
        fi

        RUN_ID="${RUN_URL##*/}"

        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "run-url=$RUN_URL" >> "$GITHUB_OUTPUT"
        echo "Dispatched run: $RUN_URL"

    - name: 👀 Watch run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        RUN_ID: ${{ steps.dispatch.outputs.run-id }}
      run: |
        set -euo pipefail

        # A single transient API error kills `gh run watch`, so retry it. Re-watching a run that
        # really failed costs nothing, because watching a completed run returns immediately.
        for attempt in 1 2 3; do
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status --compact && exit 0
          echo "Watch attempt $attempt/3 failed."
          sleep 10
        done

        echo "::error::Run $RUN_ID failed, or its status could not be read."
        exit 1
