name: cleanup caches by a branch

on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cleanup
        # The merge ref holds the caches of this PR's workflows, the head ref CodeQL's dependency caches.
        run: |
          for ref in "refs/pull/$PR_NUMBER/merge" "refs/pull/$PR_NUMBER/head"; do
            echo "Deleting caches for $ref"
            gh cache delete --all --ref "$ref" --succeed-on-no-caches
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
