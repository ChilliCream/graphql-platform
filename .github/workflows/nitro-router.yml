name: Nitro Router Compatibility

run-name: Nitro Router compatibility (${{ github.event.workflow_run.head_branch || github.ref_name }})

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      graphql_platform_ref:
        description: Upstream ref or SHA (empty uses the selected workflow branch commit)
        type: string
        required: false
      nitro_router_ref:
        description: Nitro Router branch containing the downstream workflow
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: nitro-router-${{ github.event.workflow_run.head_branch || github.ref }}-${{ inputs.graphql_platform_ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Build Nitro Router against this upstream commit
    # Only same-repository CI runs can automatically trigger commercial builds.
    # Manual dispatch supports any upstream branch, ref, or exact commit SHA.
    if: >-
      github.repository == 'ChilliCream/graphql-platform' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # This privileged workflow never checks out or executes upstream branch code.
      - name: Create downstream workflow token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ChilliCream
          repositories: nitro-router
          permission-actions: write

      - name: Dispatch downstream build
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PLATFORM_REF: ${{ inputs.graphql_platform_ref || github.event.workflow_run.head_sha || github.sha }}
          ROUTER_REF: ${{ inputs.nitro_router_ref || 'main' }}
          UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          run_url=$(gh workflow run ci.yml --repo ChilliCream/nitro-router \
            --ref "$ROUTER_REF" \
            -f graphql_platform_ref="$PLATFORM_REF" \
            -f upstream_run_url="$UPSTREAM_RUN_URL")
          if [[ ! "$run_url" =~ ^https://github\.com/ChilliCream/nitro-router/actions/runs/[0-9]+$ ]]; then
            echo "::error::Dispatch did not return a run URL. Requires gh >= 2.87.0."
            exit 1
          fi
          echo "run-id=${run_url##*/}" >> "$GITHUB_OUTPUT"
          echo "Nitro Router build: $run_url" >> "$GITHUB_STEP_SUMMARY"
          echo "graphql-platform ref: $PLATFORM_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for downstream result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run-id }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh run watch "$RUN_ID" --repo ChilliCream/nitro-router --exit-status --compact; then
              exit 0
            fi
            conclusion=$(gh run view "$RUN_ID" --repo ChilliCream/nitro-router --json conclusion --jq .conclusion) || conclusion=""
            if [[ -n "$conclusion" ]]; then
              echo "::error::Nitro Router build concluded with $conclusion."
              exit 1
            fi
            echo "Retrying workflow watch ($attempt/3)."
            sleep 10
          done
          echo "::error::Could not read the Nitro Router build result."
          exit 1
