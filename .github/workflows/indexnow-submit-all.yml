name: "IndexNow: Submit All Pages"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the IndexNow requests instead of sending them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit-all:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          sparse-checkout: website

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Submit All Sitemap URLs to IndexNow
        run: npm run indexnow:submit-all
        working-directory: website
        env:
          INDEXNOW_DRY_RUN: ${{ inputs.dry_run }}
