title: Lookup_Multiple_Skip_Levels_Around_Fields_Fetched_Through_Lookup_And_On_Same_Source_Schema
request:
  document: |
    query testQuery($skip1: Boolean!, $skip2: Boolean!) {
      productBySlug(slug: "product") {
        name
        review {
          ... @skip(if: $skip1) {
            ... @skip(if: $skip2) {
              title
              author
              rating
            }
          }
        }
      }
    }
