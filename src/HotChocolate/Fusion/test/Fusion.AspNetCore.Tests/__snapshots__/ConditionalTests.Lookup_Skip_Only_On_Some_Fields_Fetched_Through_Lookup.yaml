title: Lookup_Skip_Only_On_Some_Fields_Fetched_Through_Lookup
request:
  document: |
    query testQuery($skip: Boolean!) {
      productBySlug(slug: "product") {
        name
        review {
          title @skip(if: $skip)
          rating
        }
      }
    }
  variables: |
    {
      "skip": true
    }
response:
  body: |
    {
      "data": {
        "productBySlug": {
          "name": "Product: UHJvZHVjdDoxMTY3NDUwNjg=",
          "review": {
            "rating": 123
          }
        }
      }
    }
sourceSchemas:
  - name: A
    schema: |
      schema {
        query: Query
      }

      type Query {
        productBySlug(slug: String!): Product
      }

      type Product {
        id: ID!
        name: String!
        review: Review
      }

      type Review @key(fields: "id") {
        id: ID!
      }
    interactions:
      - request:
          accept: application/graphql-response+json; charset=utf-8, application/json; charset=utf-8, application/jsonl; charset=utf-8, text/event-stream; charset=utf-8
          document: |
            query testQuery_8a7e6c10_1 {
              productBySlug(slug: "product") {
                name
                review {
                  id
                }
              }
            }
        response:
          results:
            - |
              {
                "data": {
                  "productBySlug": {
                    "name": "Product: UHJvZHVjdDoxMTY3NDUwNjg=",
                    "review": {
                      "id": "UmV2aWV3OjE2MTgxNTI5MA=="
                    }
                  }
                }
              }
  - name: B
    schema: |
      schema {
        query: Query
      }

      type Query {
        reviewById(id: ID!): Review @lookup
      }

      type Review {
        id: ID!
        title: String!
        rating: Int!
      }
    interactions:
      - request:
          accept: application/graphql-response+json; charset=utf-8, application/json; charset=utf-8, application/jsonl; charset=utf-8, text/event-stream; charset=utf-8
          document: |
            query testQuery_8a7e6c10_2($skip: Boolean!, $__fusion_1_id: ID!) {
              reviewById(id: $__fusion_1_id) {
                rating
                title @skip(if: $skip)
              }
            }
          variables: |
            {
              "skip": true,
              "__fusion_1_id": "UmV2aWV3OjE2MTgxNTI5MA=="
            }
        response:
          results:
            - |
              {
                "data": {
                  "reviewById": {
                    "rating": 123
                  }
                }
              }
