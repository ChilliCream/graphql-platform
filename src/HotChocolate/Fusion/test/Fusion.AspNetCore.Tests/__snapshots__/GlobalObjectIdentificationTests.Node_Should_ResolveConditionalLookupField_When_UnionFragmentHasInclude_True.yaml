title: Node_Should_ResolveConditionalLookupField_When_UnionFragmentHasInclude
request:
  document: |
    query($include: Boolean!) {
      node(id: "Qm90OjE=") {
        id
        ... on CommunityContributor @include(if: $include) {
          ... on User {
            email
          }
          ... on Bot {
            owner
          }
          ... on FormerUser {
            name
          }
        }
      }
    }
  variables: |
    {
      "include": true
    }
response:
  body: |
    {
      "data": {
        "node": {
          "id": "Qm90OjE=",
          "owner": "Bot: Qm90OjE="
        }
      }
    }
sourceSchemas:
  - name: CONTRIBUTORS
    schema: |
      schema {
        query: Query
      }

      type Query {
        node(id: ID!): Node @lookup
        contributors: [CommunityContributor!]!
      }

      type Bot implements Node @key(fields: "id") {
        id: ID!
        name: String
      }

      type FormerUser {
        name: String
      }

      type User implements Node @key(fields: "id") {
        id: ID!
        name: String
      }

      interface Node {
        id: ID!
      }

      union CommunityContributor = User | FormerUser | Bot
    interactions:
      - request:
          accept: application/graphql-response+json; charset=utf-8, application/json; charset=utf-8, application/jsonl; charset=utf-8, text/event-stream; charset=utf-8
          document: |
            query Op_bee05c5d_5 {
              node(id: "Qm90OjE=") {
                __typename
                ... on Bot {
                  __typename
                  id
                }
              }
            }
        response:
          results:
            - |
              {
                "data": {
                  "node": {
                    "__typename": "Bot",
                    "id": "Qm90OjE="
                  }
                }
              }
  - name: ACCOUNTS
    schema: |
      schema {
        query: Query
      }

      type Query {
        userById(id: ID! @is(field: "id")): User @lookup @internal
        botById(id: ID! @is(field: "id")): Bot @lookup @internal
      }

      type Bot @key(fields: "id") {
        id: ID!
        owner: String
      }

      type User @key(fields: "id") {
        id: ID!
        email: String
      }
    interactions:
      - request:
          accept: application/graphql-response+json; charset=utf-8, application/json; charset=utf-8, application/jsonl; charset=utf-8, text/event-stream; charset=utf-8
          document: |
            query Op_bee05c5d_6($__fusion_2_id: ID!) {
              botById(id: $__fusion_2_id) {
                owner
              }
            }
          variables: |
            {
              "__fusion_2_id": "Qm90OjE="
            }
        response:
          results:
            - |
              {
                "data": {
                  "botById": {
                    "owner": "Bot: Qm90OjE="
                  }
                }
              }
