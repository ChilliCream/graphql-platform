  - name: ordering
    schema: |
      schema {
        query: Query
      }

      type Query {
        orders: [OrderBase]
      }

      type OrderA implements MultiOrderBase & OrderBase {
        name: String
        items: [OrderItem!]
      }

      type OrderB implements MultiOrderBase & OrderBase {
        name: String
        items: [OrderItem!]
      }

      type OrderItem {
        product: Product
      }

      type Product @key(fields: "id") {
        id: ID!
      }

      interface MultiOrderBase implements OrderBase {
        name: String
        items: [OrderItem!]
      }

      interface OrderBase {
        name: String
      }
