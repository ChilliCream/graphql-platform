title: Fixture_Should_ReportExpectedCost_When_Validated
request:
  document: |
    query Test($n: Int!) {
      results(limit: $n) {
        ... on A {
          a
        }
        ... on B {
          b
        }
      }
    }
  variables: |
    {
      "n": 4
    }
response:
  body: |
    {}
sourceSchemas:
  - name: A
    schema: |
      schema {
        query: Query
      }

      type Query {
        results(limit: Int!): [Result]
          @cost(weight: "1")
          @listSize(slicingArguments: ["limit"])
      }

      type A {
        a: Int @cost(weight: "10")
      }

      type B {
        b: Int @cost(weight: "20")
      }

      union Result = A | B

      directive @cost(weight: String!) on
        | SCALAR
        | OBJECT
        | FIELD_DEFINITION
        | ARGUMENT_DEFINITION
        | ENUM
        | INPUT_FIELD_DEFINITION

      directive @listSize(
        assumedSize: Int
        slicingArguments: [String!]
        sizedFields: [String!]
        requireOneSlicingArgument: Boolean = true
      ) on FIELD_DEFINITION
