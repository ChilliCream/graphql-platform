sourceSchemas:
  - name: a
    schema: |
      schema {
        query: Query
      }

      type Query {
        books: [Book!]!
      }

      type Author @key(fields: "id") {
        id: ID!
      }

      type Book {
        id: ID!
        title: String!
        author: Author! @shareable
      }
  - name: b
    schema: |
      schema {
        query: Query
      }

      type Query {
        lookups: InternalLookups! @internal
      }

      type Author @key(fields: "id") @key(fields: "name") {
        id: ID!
        name: String!
      }

      type InternalLookups @internal {
        author(by: AuthorByInput! @is(field: "{\n  id\n} | {\n  name\n}")): Author
          @lookup
          @internal
      }

      input AuthorByInput @oneOf {
        id: ID
        name: String
      }
    interactions:
      - request:
          accept: application/graphql-response+json; charset=utf-8, application/json; charset=utf-8, application/jsonl; charset=utf-8, text/event-stream; charset=utf-8
          document: |
            query Op_54ef22d5_2($__fusion_1_by: AuthorByInput!) {
              lookups {
                author(by: $__fusion_1_by) {
                  id
                }
              }
            }
          variables: |
            {
              "__fusion_1_by": {
                "name": "Jon Skeet"
              }
            }
        response:
          results:
            - |
              {
                "data": {
                  "lookups": {
                    "author": {
                      "id": "1"
                    }
                  }
                }
              }
  - name: c
    schema: |
      schema {
        query: Query
      }

      type Query {
        topAuthor: Author!
      }

      type Author {
        name: String! @shareable
      }
    interactions:
