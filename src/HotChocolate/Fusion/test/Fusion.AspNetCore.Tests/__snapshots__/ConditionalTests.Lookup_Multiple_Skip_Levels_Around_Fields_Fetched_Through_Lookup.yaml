    query testQuery($skip1: Boolean!, $skip2: Boolean!) {
      productBySlug(slug: "product") {
        name
        review {
          ... @skip(if: $skip1) {
            ... @skip(if: $skip2) {
              title
              rating
            }
          }
        }
      }
    }
