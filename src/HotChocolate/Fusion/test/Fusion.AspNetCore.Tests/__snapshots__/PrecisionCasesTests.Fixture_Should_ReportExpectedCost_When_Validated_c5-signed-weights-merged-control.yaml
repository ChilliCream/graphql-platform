title: Fixture_Should_ReportExpectedCost_When_Validated
request:
  document: |
    {
      book {
        title
        author {
          name
        }
      }
    }
response:
  body: |
    {}
sourceSchemas:
  - name: A
    schema: |
      schema {
        query: Query
      }

      type Query @cost(weight: "0") {
        book: Book
      }

      type Author {
        name: Text
      }

      type Book @cost(weight: "-7") {
        title: Text
        author: Author
      }

      "Defines the possible serialization types for GraphQL scalar values."
      enum ScalarSerializationType {
        "The scalar serializes to a string value."
        STRING
        "The scalar serializes to a boolean value."
        BOOLEAN
        "The scalar serializes to an integer value."
        INT
        "The scalar serializes to a floating-point value."
        FLOAT
        "The scalar serializes to an object value."
        OBJECT
        "The scalar serializes to a list value."
        LIST
      }

      scalar Text
        @serializeAs(type: [STRING, BOOLEAN, INT, FLOAT, OBJECT, LIST])
        @cost(weight: "5")
        @specifiedBy(url: "https://scalars.graphql.org/chillicream/any.html")

      directive @cost(weight: String!) on
        | SCALAR
        | OBJECT
        | FIELD_DEFINITION
        | ARGUMENT_DEFINITION
        | ENUM
        | INPUT_FIELD_DEFINITION

      directive @serializeAs(
        "The primitive type a scalar is serialized to."
        type: [ScalarSerializationType!]!
        "The ECMA-262 regex pattern that the serialized scalar value conforms to."
        pattern: String
      ) on SCALAR
