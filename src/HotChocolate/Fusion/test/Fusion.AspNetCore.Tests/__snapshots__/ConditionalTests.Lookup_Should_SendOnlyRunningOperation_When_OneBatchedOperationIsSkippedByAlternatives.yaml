title: Lookup_Should_SendOnlyRunningOperation_When_OneBatchedOperationIsSkippedByAlternatives
request:
  document: |
    query testQuery($a: Boolean!, $b: Boolean!, $c: Boolean!, $d: Boolean!) {
      first: thing {
        id
        delta @skip(if: $a)
        epsilon @skip(if: $b)
      }
      second: thing {
        id
        delta @skip(if: $c)
        epsilon @skip(if: $d)
      }
    }
  variables: |
    {
      "a": true,
      "b": true,
      "c": true,
      "d": false
    }
response:
  body: |
    {
      "data": {
        "first": {
          "id": 123
        },
        "second": {
          "id": 123,
          "epsilon": 123
        }
      }
    }
