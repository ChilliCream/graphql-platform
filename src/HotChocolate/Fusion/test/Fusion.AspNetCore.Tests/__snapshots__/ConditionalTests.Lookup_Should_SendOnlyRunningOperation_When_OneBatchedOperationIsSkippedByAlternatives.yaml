title: Lookup_Should_SendOnlyRunningOperation_When_OneBatchedOperationIsSkippedByAlternatives
request:
  document: |
    query testQuery($a: Boolean!, $b: Boolean!, $c: Boolean!, $d: Boolean!) {
      first: thing {
        id
        delta @skip(if: $a)
        epsilon @skip(if: $b)
      }
      second: thing {
        id
        delta @skip(if: $c)
        epsilon @skip(if: $d)
      }
    }
  variables: |
    {
      "a": true,
      "b": true,
      "c": true,
      "d": false
    }
response:
  body: |
    {
      "data": {
        "first": {
          "id": 123
        },
        "second": {
          "id": 123,
          "epsilon": 123
        }
      }
    }
sourceSchemas:
  - name: A
    schema: |
      schema {
        query: Query
      }

      type Query {
        thing: Thing
      }

      type Thing @key(fields: "id") {
        id: Int!
      }
    interactions:
      - request:
          accept: application/graphql-response+json; charset=utf-8, application/json; charset=utf-8, application/jsonl; charset=utf-8, text/event-stream; charset=utf-8
          document: |
            query testQuery_7bad7696_1 {
              first: thing {
                id
              }
              second: thing {
                id
              }
            }
        response:
          results:
            - |
              {
                "data": {
                  "first": {
                    "id": 123
                  },
                  "second": {
                    "id": 123
                  }
                }
              }
  - name: B
    schema: |
      schema {
        query: Query
      }

      type Query {
        thingById(id: Int!): Thing @lookup
      }

      type Thing {
        id: Int!
        delta: Int!
        epsilon: Int!
      }
    interactions:
      - request:
          accept: application/jsonl; charset=utf-8, text/event-stream; charset=utf-8, application/graphql-response+json; charset=utf-8, application/json; charset=utf-8
          document: |
            query testQuery_7bad7696_2($c: Boolean!, $d: Boolean!, $__fusion_1_id: Int!) {
              thingById(id: $__fusion_1_id) {
                delta @skip(if: $c)
                epsilon @skip(if: $d)
              }
            }
          variables: |
            {
              "c": true,
              "d": false,
              "__fusion_1_id": 123
            }
        response:
          results:
            - |
              {
                "data": {
                  "thingById": {
                    "epsilon": 123
                  }
                }
              }
