  - name: catalog-api
    schema: |
      schema {
        query: Query
      }

      type Query {
        productByUpc(upc: ID!): Product @lookup
      }

      type Dimensions {
        width: Int!
        height: Int!
      }

      type Product @key(fields: "upc") {
        warranty: String
        upc: ID!
        name: String!
        price: Int!
        status: ProductStatus
        dimensions: Dimensions!
      }

      enum ProductStatus {
        AVAILABLE
        DISCONTINUED
        HIDDEN @inaccessible
      }
    interactions:
