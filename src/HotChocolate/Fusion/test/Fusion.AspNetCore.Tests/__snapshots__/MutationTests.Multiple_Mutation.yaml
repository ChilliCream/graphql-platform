title: Multiple_Mutation
request:
  document: |
    mutation {
      a: createBook(input: { title: "Book1" }) {
        book {
          id
          author
        }
      }
      b: createBook(input: { title: "Book2" }) {
        book {
          id
          title
          author
        }
      }
    }
response:
  body: |
    {
      "data": {
        "a": {
          "book": {
            "id": 1,
            "author": "Abc"
          }
        },
        "b": {
          "book": {
            "id": 2,
            "title": "Book2",
            "author": "Abc"
          }
        }
      }
    }
