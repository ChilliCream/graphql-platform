            reviews(first: 2) @include(if: $includeReviews) {
              nodes {
                id
                body
                stars
              }
            }
          }
          ... on Article {
            id
            title
            description
            content
            publishedAt
            tags @include(if: $includeExpensive)
            author @include(if: $includeDetails) {
              id
              id @fusion__requirement
              displayName
            }
          }
        }
        viewer {
          displayName
          reviews(first: 5) @include(if: $includeReviews) {
            pageInfo {
              hasNextPage
              hasPreviousPage
              ... @include(if: $includeMetadata) {
                startCursor
                endCursor
              }
            }
            edges {
              cursor
              node {
                id
                body
                stars
                author @include(if: $includeDetails) {
                  id
                  id @fusion__requirement
                  displayName
                  reviews(first: 2) {
                    nodes {
                      id
                      id @fusion__requirement
                      body
                      stars
                    }
                  }
                }
              }
            }
          }
        }
      }
