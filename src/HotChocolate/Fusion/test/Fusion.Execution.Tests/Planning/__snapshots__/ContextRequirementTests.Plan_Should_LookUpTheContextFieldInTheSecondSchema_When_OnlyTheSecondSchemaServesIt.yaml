operation:
  - document: |
      {
        me {
          transactions {
            amount
            id @fusion__requirement
          }
          userCurrency @fusion__requirement {
            isoCode @fusion__requirement
          }
          id @fusion__requirement
        }
      }
    hash: 123456789101112
    searchSpace: 1
    expandedNodes: 3
nodes:
  - id: 1
    type: Operation
    schema: a
    operation: |
      query Op_123456789101112_1 {
        me {
          transactions {
            id
          }
          id
        }
      }
  - id: 2
    type: Operation
    schema: a
    operation: |
      query Op_123456789101112_2($__fusion_1_currency: String!, $__fusion_2_id: ID!) {
        transactionById(id: $__fusion_2_id) {
          amount(currency: $__fusion_1_currency)
        }
      }
    source: $.transactionById
    target: $.me.transactions
    requirements:
      - name: __fusion_1_currency
        selectionMap: >-
          $userContext.userCurrency.isoCode
        contextRoots:
          - name: userContext
            path: $.me
      - name: __fusion_2_id
        selectionMap: >-
          id
    dependencies:
      - id: 1
      - id: 3
  - id: 3
    type: Operation
    schema: b
    operation: |
      query Op_123456789101112_3($__fusion_3_id: ID!) {
        userById(id: $__fusion_3_id) {
          userCurrency {
            isoCode
          }
        }
      }
    source: $.userById
    target: $.me
    requirements:
      - name: __fusion_3_id
        selectionMap: >-
          id
    dependencies:
      - id: 1
