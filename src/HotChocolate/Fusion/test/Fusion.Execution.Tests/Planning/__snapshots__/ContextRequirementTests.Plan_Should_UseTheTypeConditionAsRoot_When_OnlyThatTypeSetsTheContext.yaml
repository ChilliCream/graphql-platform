operation:
  - document: |
      {
        owner {
          __typename @fusion__requirement
          ... on Customer {
            transactions {
              amount
              id @fusion__requirement
            }
            currency @fusion__requirement
          }
        }
      }
    hash: 123456789101112
    searchSpace: 1
    expandedNodes: 2
nodes:
  - id: 1
    type: Operation
    schema: a
    operation: |
      query Op_123456789101112_1 {
        owner {
          __typename
          ... on Customer {
            transactions {
              id
            }
            currency
          }
        }
      }
  - id: 2
    type: Operation
    schema: a
    operation: |
      query Op_123456789101112_2($__fusion_1_currency: String!, $__fusion_2_id: ID!) {
        transactionById(id: $__fusion_2_id) {
          amount(currency: $__fusion_1_currency)
        }
      }
    source: $.transactionById
    target: $.owner<Customer>.transactions
    requirements:
      - name: __fusion_1_currency
        selectionMap: >-
          $ownerContext.currency
        contextRoots:
          - name: ownerContext
            path: $.owner<Customer>
      - name: __fusion_2_id
        selectionMap: >-
          id
    dependencies:
      - id: 1
