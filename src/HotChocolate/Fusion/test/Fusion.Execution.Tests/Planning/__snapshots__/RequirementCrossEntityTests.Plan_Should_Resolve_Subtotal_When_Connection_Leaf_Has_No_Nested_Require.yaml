operation:
  - document: |
      {
        viewer {
          cart {
            subtotal
            id @fusion__requirement
            items(first: 50) @fusion__requirement {
              nodes @fusion__requirement {
                product @fusion__requirement {
                  price @fusion__requirement
                  id @fusion__requirement
                }
              }
            }
          }
        }
      }
    hash: 123456789101112
    searchSpace: 2
    expandedNodes: 10
nodes:
  - id: 2
    type: Operation
    schema: cart
    operation: |
      query Op_123456789101112_2($__fusion_1_lines: [Float!], $__fusion_2_id: ID!) {
        cartById(id: $__fusion_2_id) {
          subtotal(lines: $__fusion_1_lines)
        }
      }
    source: $.cartById
    target: $.viewer.cart
    requirements:
      - name: __fusion_1_lines
        selectionMap: >-
          items(first: 50).nodes[product.price]
      - name: __fusion_2_id
        selectionMap: >-
          id
    dependencies:
      - id: 3
      - id: 4
      - id: 7
  - id: 3
    type: Operation
    schema: cart
    operation: |
      query Op_123456789101112_3($__fusion_3_id: ID!) {
        cartById(id: $__fusion_3_id) {
          items(first: 50) {
            nodes {
              product {
                id
              }
            }
          }
        }
      }
    source: $.cartById
    target: $.viewer.cart
    requirements:
      - name: __fusion_3_id
        selectionMap: >-
          id
    dependencies:
      - id: 7
  - id: 4
    type: Operation
    schema: products
    operation: |
      query Op_123456789101112_4($__fusion_4_id: ID!) {
        productById(id: $__fusion_4_id) {
          price
        }
      }
    source: $.productById
    target: $.viewer.cart.items.nodes.product
    requirements:
      - name: __fusion_4_id
        selectionMap: >-
          id
    dependencies:
      - id: 3
  - id: 5
    type: OperationBatch
    schema: cart
    operation: |
      query Op_123456789101112_5 {
        viewer {
          cart {
            id
          }
        }
      }
    targets:
      - $
      - $
    batchingGroupId: 7
