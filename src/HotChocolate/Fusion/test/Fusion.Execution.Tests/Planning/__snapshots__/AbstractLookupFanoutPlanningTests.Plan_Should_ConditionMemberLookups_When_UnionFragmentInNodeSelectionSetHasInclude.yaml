      query($include: Boolean!) {
        node(id: "test-id") {
          __typename @fusion__requirement
          id
          ... on CommunityContributor @include(if: $include) {
            id @fusion__requirement
            ... on User {
              email
            }
            ... on Bot {
              owner
            }
            ... on FormerUser {
              name
            }
          }
        }
      }
    hash: 123456789101112
    searchSpace: 1
    expandedNodes: 1
