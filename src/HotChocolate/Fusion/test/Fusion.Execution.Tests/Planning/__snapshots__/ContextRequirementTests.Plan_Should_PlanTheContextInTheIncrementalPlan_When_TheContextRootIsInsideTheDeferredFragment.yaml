operation:
  - document: |
      {
        __typename @fusion__empty
      }
    hash: 123456789101112
    searchSpace: 1
    expandedNodes: 1
nodes:
deliveryGroups:
  - id: 0
    path: $
incrementalPlans:
  - deliveryGroupIds:
      - 0
    parentNodeId: 0
    nodes:
      - id: 1
        type: Operation
        schema: a
        operation: |
          query Op_defer_1 {
            me {
              transactions {
                id
              }
              userCurrency {
                isoCode
              }
            }
          }
      - id: 2
        type: Operation
        schema: a
        operation: |
          query Op_defer_2($__fusion_1_currency: String!, $__fusion_2_id: ID!) {
            transactionById(id: $__fusion_2_id) {
              amount(currency: $__fusion_1_currency)
            }
          }
        source: $.transactionById
        target: $.me.transactions
        requirements:
          - name: __fusion_1_currency
            selectionMap: >-
              $userContext.userCurrency.isoCode
            contextRoots:
              - name: userContext
                path: $.me
          - name: __fusion_2_id
            selectionMap: >-
              id
        dependencies:
          - id: 1
