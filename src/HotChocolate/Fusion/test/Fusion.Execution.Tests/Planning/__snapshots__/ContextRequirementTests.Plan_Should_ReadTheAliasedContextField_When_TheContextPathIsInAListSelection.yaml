operation:
  - document: |
      {
        tenant {
          currency(region: "EU")
          users {
            orders {
              shippingSummary
              id @fusion__requirement
              items @fusion__requirement {
                weight @fusion__requirement
              }
            }
          }
          fusion__requirement_currency_0: currency @fusion__requirement
        }
