    schema: a
    operation: |
      query Op_123456789101112_2(
        $__fusion_1_lines: [LineInput!]!
        $__fusion_2_id: ID!
      ) {
        orderById(id: $__fusion_2_id) {
          shippingSummary(lines: $__fusion_1_lines)
        }
      }
