operation:
  - document: |
      {
        me {
          transactions {
            amount
            fee
            id @fusion__requirement
          }
          userCurrency @fusion__requirement {
            isoCode @fusion__requirement
          }
        }
      }
    hash: 123456789101112
    searchSpace: 1
    expandedNodes: 2
nodes:
  - id: 1
    type: Operation
    schema: a
    operation: |
      query Op_123456789101112_1 {
        me {
          transactions {
            id
          }
          userCurrency {
            isoCode
          }
        }
      }
  - id: 2
    type: Operation
    schema: a
    operation: |
      query Op_123456789101112_2(
        $__fusion_1_currency: String!
        $__fusion_2_id: ID!
        $__fusion_3_currency: String!
      ) {
        transactionById(id: $__fusion_2_id) {
          fee(currency: $__fusion_1_currency)
          amount(currency: $__fusion_3_currency)
        }
      }
    source: $.transactionById
    target: $.me.transactions
    requirements:
      - name: __fusion_1_currency
        selectionMap: >-
          $userContext.userCurrency.isoCode
        contextRoots:
          - name: userContext
            path: $.me
      - name: __fusion_2_id
        selectionMap: >-
          id
      - name: __fusion_3_currency
        selectionMap: >-
          $userContext.userCurrency.isoCode
        contextRoots:
          - name: userContext
            path: $.me
    dependencies:
      - id: 1
