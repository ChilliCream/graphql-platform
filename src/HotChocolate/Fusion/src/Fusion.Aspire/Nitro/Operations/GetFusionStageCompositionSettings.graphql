query GetFusionStageCompositionSettings($apiId: ID!, $stageName: String!) {
  apiById(id: $apiId) {
    stage(name: $stageName) {
      compositionSettings {
        cacheControlMergeBehavior
        enableGlobalObjectIdentification
        excludeByTag
        nodeResolution
        removeUnreferencedDefinitions
        tagMergeBehavior
      }
    }
  }
}
