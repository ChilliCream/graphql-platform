schema {
  query: Query
}

type Query {
  "Fetches an object given its ID."
  node("ID of the object." id: ID!): Node @shareable @inaccessible
  "Lookup nodes by a list of IDs."
  nodes("The list of node IDs." ids: [ID!]!): [Node]! @shareable @inaccessible
  product(id: Int!): Product!
}

type Product implements Node {
  id: ID!
  name: String!
}

"The node interface is implemented by entities that have a global unique identifier."
interface Node {
  id: ID!
}

"""
The @inaccessible directive is used to prevent specific type system members
from being accessible through the client-facing composite schema,
even if they are accessible in the underlying source schemas.


This directive is useful for restricting access to type system members that
are either irrelevant to the client-facing composite schema or sensitive in nature,
such as internal identifiers or fields intended only for backend use.


directive @inaccessible on FIELD_DEFINITION
  | OBJECT | INTERFACE | UNION | ARGUMENT_DEFINITION
  | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION
"""
directive @inaccessible on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | INTERFACE
  | UNION
  | ENUM
  | ENUM_VALUE
  | INPUT_OBJECT
  | INPUT_FIELD_DEFINITION

"""
By default, only a single source schema is allowed to contribute
a particular field to an object type.

            
This prevents source schemas from inadvertently defining similarly named
fields that are not semantically equivalent.

            
Fields must be explicitly marked as @shareable to allow multiple source
schemas to define them, ensuring that the decision to serve a field from
more than one source schema is intentional and coordinated.


directive @shareable repeatable on OBJECT | FIELD_DEFINITION
"""
directive @shareable repeatable on OBJECT | FIELD_DEFINITION
